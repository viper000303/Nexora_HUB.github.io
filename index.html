
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexora-HUB</title>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #090914;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #121225;
  padding: 20px;
  border-bottom: 1px solid #29294c;
}

h1 { color: #a78bfa; margin: 0; }

header p { color: #aaa; }

main {
  padding: 20px;
  max-width: 1000px;
  margin: auto;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #444;
  background: #17172b;
  color: white;
  font-size: 16px;
  margin: 15px 0;
}

.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 15px;
}

.game {
  background: #17172b;
  padding: 20px;
  border-radius: 15px;
  border: 1px solid #33335a;
  cursor: pointer;
  text-align: center;
}

.game:hover {
  border-color: #a78bfa;
  transform: translateY(-3px);
}

button {
  background: #7c3aed;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 10px;
  cursor: pointer;
}

#player {
  margin-top: 25px;
}

#gamebox {
  width: 100%;
  min-height: 300px;
  background: black;
}

footer {
  text-align: center;
  padding: 30px;
  color: #777;
}
</style>
</head>

<body>
<header>
  <h1>🎮 Nexora-HUB</h1>
  <p>Your browser gaming destination</p>
</header>

<main>
  <h2>Game Library</h2>

  <input id="search"
    placeholder="Search games..."
    oninput="filterGames()">

  <div class="games" id="games">
    <div class="game" onclick="playGame()"
         data-name="Flash Games">
      <h3>🕹️ Flash Games</h3>
      <p>Play classic SWF games</p>
    </div>

    <div class="game" data-name="HTML5 Games">
      <h3>🌐 HTML5 Games</h3>
      <p>Coming soon</p>
    </div>

    <div class="game" data-name="Retro Games">
      <h3>👾 Retro Games</h3>
      <p>Coming soon</p>
    </div>
  </div>

  <section id="player" hidden>
    <h2>Flash Player</h2>
    <p>Upload a legally obtained SWF game file below.</p>

    <input type="file" id="swf"
           accept=".swf">

    <div id="gamebox"></div>
    <br>
    <button onclick="closeGame()">Close Game</button>
  </section>
</main>

<footer>
  Nexora-HUB © 2026
</footer>

<script>
function filterGames() {
  const query =
    document.getElementById("search").value.toLowerCase();

  document.querySelectorAll(".game").forEach(game => {
    game.style.display =
      game.dataset.name.toLowerCase().includes(query)
      ? "" : "none";
  });
}

function playGame() {
  document.getElementById("player").hidden = false;
  document.getElementById("player").scrollIntoView();
}

function closeGame() {
  document.getElementById("player").hidden = true;
  document.getElementById("gamebox").innerHTML = "";
}

document.getElementById("swf").addEventListener("change",
  function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const url = URL.createObjectURL(file);
    const box = document.getElementById("gamebox");
    box.innerHTML = "";

    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();

    player.style.width = "100%";
    player.style.height = "500px";

    box.appendChild(player);
    player.load(url);
  }
);
</script>
</body>
</html>
